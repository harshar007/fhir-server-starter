[project]
name = "fhir-server-starter"
version = "0.1.0"
description = "FHIR R4 server starter kit: one Organization example resource, dual FHIR/plain JSON responses, native base R4 validation, real OperationOutcome errors, JWT auth, optional Redis caching, Docker."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.31.0",
    "dependency-injector>=4.48.3",
    "fastapi[standard]>=0.129.0",
    "jsonschema>=4.23.0",
    "pydantic-settings>=2.13.0",
    "pyjwt>=2.11.0",
    "pyyaml>=6.0.3",
    "redis>=7.2.0",
    "scalar-fastapi>=1.9.1",
    "sqlalchemy[asyncio]>=2.0.46",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
